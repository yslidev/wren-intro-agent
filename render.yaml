services:
  - type: web
    name: wren-intro-agent
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TRANSPORT
        value: sim
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LINQ_API_TOKEN
        sync: false
      - key: LINQ_FROM_NUMBER
        sync: false
      - key: LINQ_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
