# One-click blueprint: https://render.com/deploy?repo=https://github.com/yslidev/wren-intro-agent
# Boots in simulator mode until LINQ_API_TOKEN and LINQ_FROM_NUMBER are set, then switches to Linq.
services:
  - type: web
    name: wren-intro-agent
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TRANSPORT
        value: linq
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LINQ_API_TOKEN
        sync: false
      - key: LINQ_FROM_NUMBER
        sync: false
      - key: LINQ_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MATCH_DELAY_MS
        value: "20000"
      - key: FOLLOWUP_DELAY_MS
        value: "3600000"
